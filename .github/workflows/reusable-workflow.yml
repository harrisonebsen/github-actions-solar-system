name: Testing - Reusable Workflow

on: 
  workflow_call:
    inputs:
      ingress-url:
        description: Provide the Ingress URL
        required: true
        type: string

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check service health
        env:
          URL: ${{ inputs.ingress-url }}
        run: |
          echo "Checking service at: https://$URL/live"

          # Get response (avoid failure if curl itself errors out)
          response=$(curl -s -k https://$URL/live || echo "")
          echo "Raw response: $response"

          # Extract status safely
          status=$(echo "$response" | jq -r .status 2>/dev/null || echo "unknown")
          echo "Parsed status: $status"

          # Validate
          if [ "$status" != "live" ]; then
            echo "❌ Service is not live (expected 'live', got '$status')"
            exit 1
          fi

          echo "✅ Service is live!"
